name: WebAstra Cloud Builder

on:
  repository_dispatch:
    types: [build-web-app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Template Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Parse Config & Build App
        env:
          RAW_DATA: ${{ github.event.client_payload.data }}
        run: |
          python3 - << 'EOF'
          import os, json, base64, re, subprocess

          data = json.loads(os.environ["RAW_DATA"])
          
          build_id = data["buildId"]
          app_name = data["appName"]
          pkg_name = data["packageName"]
          url = data["url"]
          theme_color = data["themeColor"]
          v_name = data["versionName"]
          v_code = str(data["versionCode"])
          build_type = data["buildType"]
          features = data["features"]

          safe_name = re.sub(r"[^a-zA-Z0-9_-]", "", app_name) or "WebAstraApp"
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"BUILD_ID={build_id}\n")
              env_file.write(f"SAFE_NAME={safe_name}\n")

          # 1. Update strings.xml
          os.makedirs("app/src/main/res/values", exist_ok=True)
          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(f'<resources>\n    <string name="app_name">{app_name}</string>\n    <string name="target_url">{url}</string>\n</resources>')

          # 2. Update colors.xml
          with open("app/src/main/res/values/colors.xml", "w") as f:
              f.write(f'<resources>\n    <color name="primary_theme">{theme_color}</color>\n</resources>')

          # 3. Write Feature Flags JSON
          os.makedirs("app/src/main/assets", exist_ok=True)
          with open("app/src/main/assets/config.json", "w") as f:
              json.dump(features, f)

          # 4. Decode App Icon
          if data.get("iconBase64"):
              icon_bytes = base64.b64decode(data["iconBase64"])
              for density in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  os.makedirs(f"app/src/main/res/{density}", exist_ok=True)
                  with open(f"app/src/main/res/{density}/ic_launcher.png", "wb") as img:
                      img.write(icon_bytes)
                  with open(f"app/src/main/res/{density}/ic_launcher_round.png", "wb") as img:
                      img.write(icon_bytes)

          # 5. Update app/build.gradle.kts
          with open("app/build.gradle.kts", "r") as f:
              gradle = f.read()
          gradle = re.sub(r'applicationId = ".*?"', f'applicationId = "{pkg_name}"', gradle)
          gradle = re.sub(r'versionCode = \d+', f'versionCode = {v_code}', gradle)
          gradle = re.sub(r'versionName = ".*?"', f'versionName = "{v_name}"', gradle)
          with open("app/build.gradle.kts", "w") as f:
              f.write(gradle)

          # 6. Execute Gradle Build using system gradle
          os.makedirs("output", exist_ok=True)

          if build_type == "DEBUG_APK":
              subprocess.run(["gradle", "assembleDebug"], check=True)
              os.rename("app/build/outputs/apk/debug/app-debug.apk", f"output/{safe_name}-debug.apk")

          elif build_type in ["SIGNED_APK", "SIGNED_AAB"]:
              jks_path = os.path.abspath("app/release.jks")
              with open(jks_path, "wb") as ks:
                  ks.write(base64.b64decode(data["keystoreBase64"]))
              
              ks_pass = data["keystorePassword"]
              k_alias = data["keyAlias"]
              k_pass = data["keyPassword"]

              if build_type == "SIGNED_APK":
                  subprocess.run([
                      "gradle", "assembleRelease",
                      f"-Pandroid.injected.signing.store.file={jks_path}",
                      f"-Pandroid.injected.signing.store.password={ks_pass}",
                      f"-Pandroid.injected.signing.key.alias={k_alias}",
                      f"-Pandroid.injected.signing.key.password={k_pass}"
                  ], check=True)
                  os.rename("app/build/outputs/apk/release/app-release.apk", f"output/{safe_name}-signed.apk")
              else:
                  subprocess.run([
                      "gradle", "bundleRelease",
                      f"-Pandroid.injected.signing.store.file={jks_path}",
                      f"-Pandroid.injected.signing.store.password={ks_pass}",
                      f"-Pandroid.injected.signing.key.alias={k_alias}",
                      f"-Pandroid.injected.signing.key.password={k_pass}"
                  ], check=True)
                  os.rename("app/build/outputs/bundle/release/app-release.aab", f"output/{safe_name}-signed.aab")
          EOF

      - name: Cleanup Sensitive Files
        if: always()
        run: rm -f app/release.jks

      - name: Upload Built Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webastra-build-${{ env.BUILD_ID }}
          path: output/*
          retention-days: 1
